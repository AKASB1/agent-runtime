[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "A small, deterministic, replayable agent runtime at harness level (simulated evaluation)."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "jsonschema>=4.17",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp==2.2.0"]
eval = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
dev = ["pytest>=7.4", "ruff>=0.6", "pytest-repeat>=0.9"]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP046", "UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
