name: Documentation
description: Something in the documentation is wrong, missing, or unclear
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: "docs/contracts.md, section 10"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
